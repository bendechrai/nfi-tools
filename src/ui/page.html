  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }

  :root {
    color-scheme: light dark;
    --page: #EDF0F2;
    --surface: #F6F8F9;
    --field: #FFFFFF;
    --field-rule: #C9CFD4;
    --field-off: #E7EBEE;
    --field-off-rule: #7A848D;
    --ink: #0C1116;
    --ink-2: #55606B;
    --rule: #C9CFD4;
    --grid: rgba(12, 17, 22, .06);
    --vault: #0F2620;
    --vault-fg: #E6EAED;
    --vault-dim: #9CB0A7;
    --tape: #FFD23F;
    --tape-ink: #0C1116;
    --sans: "Archivo Sub", Archivo, Arial, Helvetica, sans-serif;
    --cnd: "Archivo Cnd", "Archivo Narrow", "Arial Narrow", Arial, sans-serif;
    --mono: "Martian Mono Sub", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0C1116;
      --surface: #121920;
      --field: #212B34;
      --field-rule: #3C4854;
      --field-off: #0A0F14;
      --field-off-rule: #5D6975;
      --ink: #E6EAED;
      --ink-2: #A3ADB6;
      --rule: #29333B;
      --grid: rgba(230, 234, 237, .045);
    }

    /* the vault green sits ~1.1:1 against the dark card, so give the
       header strip an explicit edge */
    .head { border-bottom: 1px solid var(--tape); }
  }

  body {
    min-height: 100vh;
    padding: 24px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--page);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 520px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 3px;
    overflow: hidden;
  }

  /* tamper tape: the seal motif carried over from the site */
  .seal {
    height: 4px;
    background: repeating-linear-gradient(-45deg, var(--tape) 0 5.657px, var(--tape-ink) 5.657px 11.314px);
  }

  .head {
    background: var(--vault);
    color: var(--vault-fg);
    padding: 15px 22px 17px;
  }

  .brand {
    display: block;
    font-family: var(--cnd);
    font-weight: 700;
    font-size: 25px;
    line-height: 1;
    letter-spacing: -.02em;
  }

  .hsub {
    margin-top: 9px;
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--vault-dim);
    overflow-wrap: anywhere;
  }

  .hkey { color: var(--vault-fg); }

  .filebar {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 10px 22px;
    border-bottom: 1px solid var(--rule);
  }

  .tag {
    flex: none;
    font-family: var(--cnd);
    font-weight: 600;
    font-size: 10px;
    line-height: 1.6;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-2);
  }

  /* paths carry a <wbr> after every separator, so they break at "/" and
     only fall back to breaking a segment that cannot fit on its own line */
  .path {
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.5;
    overflow-wrap: break-word;
  }

  .body { padding: 22px; }

  .field { margin-bottom: 20px; }

  .field-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
  }

  label.key-label {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 4px 9px;
    min-width: 0;
  }

  .key-name {
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }

  .existing-badge {
    flex: none;
    border: 1px solid var(--tape);
    padding: 0 6px;
    font-family: var(--cnd);
    font-weight: 600;
    font-size: 10px;
    line-height: 1.6;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-2);
  }

  .overwrite-toggle {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 24px;
    padding: 4px 0;
    margin: -4px 0;
    cursor: pointer;
    font-family: var(--cnd);
    font-weight: 600;
    font-size: 10.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-2);
  }

  .overwrite-toggle:hover { color: var(--ink); }

  .overwrite-toggle input {
    width: 15px;
    height: 15px;
    margin: 0;
    accent-color: var(--tape);
    cursor: pointer;
  }

  .overwrite-toggle input:focus-visible {
    outline: 2px solid var(--tape);
    outline-offset: 1px;
  }

  .input-wrap { position: relative; }

  input[type="password"],
  input[type="text"] {
    width: 100%;
    padding: 11px 64px 11px 12px;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: .04em;
    background: var(--field);
    color: var(--ink);
    border: 1px solid var(--field-rule);
    border-radius: 2px;
    outline: none;
    transition: border-color .12s linear, box-shadow .12s linear;
  }

  input:focus {
    border-color: var(--ink);
    box-shadow: 0 0 0 2px var(--tape);
  }

  input:disabled {
    background: var(--field-off);
    border: 1px dashed var(--field-off-rule);
    color: var(--ink-2);
    cursor: not-allowed;
  }

  .toggle-vis {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    background: none;
    border: 0;
    padding: 4px 8px;
    font-family: var(--mono);
    font-size: 10.5px;
    line-height: 1;
    color: var(--ink-2);
    cursor: pointer;
    text-decoration: underline;
    text-decoration-color: var(--tape);
    text-decoration-thickness: 2px;
    text-underline-offset: 3px;
  }

  .toggle-vis:hover:not(:disabled) { color: var(--ink); }
  .toggle-vis:focus-visible { outline: 2px solid var(--tape); outline-offset: 1px; }

  .toggle-vis:disabled {
    color: var(--field-off-rule);
    text-decoration-color: var(--field-off-rule);
    cursor: not-allowed;
  }

  .save {
    display: block;
    width: 100%;
    margin-top: 22px;
    padding: 13px 20px;
    background: var(--tape);
    color: var(--tape-ink);
    border: 1px solid var(--tape-ink);
    border-radius: 2px;
    font-family: var(--cnd);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .12s linear, color .12s linear;
  }

  .save:hover { background: var(--tape-ink); color: var(--tape); }
  .save:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .save:active { transform: translateY(1px); }

  .save:disabled {
    background: var(--page);
    color: var(--ink-2);
    border-color: var(--rule);
    cursor: not-allowed;
    transform: none;
  }

  .error {
    margin-top: 16px;
    border: 1px solid var(--ink);
    border-left: 3px solid var(--tape);
    padding: 9px 12px;
    font-size: 13px;
    line-height: 1.45;
    color: var(--ink);
    overflow-wrap: anywhere;
  }

  .error::before {
    content: "Error";
    display: block;
    font-family: var(--cnd);
    font-weight: 600;
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink);
    margin-bottom: 2px;
  }

  .success {
    padding: 26px 22px 28px;
    animation: rise .28s cubic-bezier(.2, .7, .2, 1) both;
  }

  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }

  .tick-box {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    margin-bottom: 16px;
    background: var(--tape);
    border: 1px solid var(--tape-ink);
  }

  .tick {
    display: block;
    width: 16px;
    height: 13px;
    fill: none;
    stroke: var(--tape-ink);
    stroke-width: 2.2;
    stroke-linecap: square;
  }

  .success h2 {
    font-family: var(--cnd);
    font-weight: 700;
    font-size: 19px;
    line-height: 1.25;
    letter-spacing: .01em;
    overflow-wrap: anywhere;
  }

  .success h2 .path { font-size: 13px; font-weight: 400; }

  .success p {
    margin-top: 8px;
    font-size: 14px;
    color: var(--ink-2);
  }

  .note {
    border-top: 1px solid var(--rule);
    padding: 12px 22px;
    font-size: 12px;
    line-height: 1.45;
    color: var(--ink-2);
  }

  @media (max-width: 460px) {
    body { padding: 16px; }
    .head { padding: 14px 16px 16px; }
    .filebar { padding: 10px 16px; }
    .body { padding: 18px 16px; }
    .success { padding: 22px 16px 24px; }
    .note { padding: 12px 16px; }
    .field-header { flex-wrap: wrap; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>

<main class="card" id="app">
  <div class="seal" aria-hidden="true"></div>

  <header class="head">
    <b class="brand">nfi</b>
    <p class="hsub" id="prompt-sub"></p>
  </header>

  <div class="filebar" id="filebar">
    <span class="tag">File</span>
    <span class="path" id="target-file"></span>
  </div>

  <form id="form">
    <div class="body">
      <div id="fields"></div>

      <button type="submit" class="save" id="submit-btn">Save</button>

      <div class="error" id="error" role="alert" hidden></div>
    </div>
  </form>

  <div class="success" id="success" role="status" hidden>
    <span class="tick-box" aria-hidden="true"><svg class="tick" viewBox="0 0 22 18"><path d="M1.6 9.4 8 15.8 20.4 2.2"/></svg></span>
    <h2>Saved to <span class="path" id="success-file"></span></h2>
    <p>You can close this tab.</p>
  </div>

  <p class="note">This page is served by nfi on your machine. The value goes to the file and nowhere else.</p>
</main>

<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");
  const keys = JSON.parse(decodeURIComponent(params.get("keys") || "[]"));
  const existing = JSON.parse(decodeURIComponent(params.get("existing") || "[]"));
  const file = decodeURIComponent(params.get("file") || "");

  // Paths are injected as text nodes only; the <wbr> elements are break
  // opportunities so a long path wraps after a separator, never mid-segment.
  function setPath(el, value) {
    el.textContent = "";
    const parts = value.split("/");
    parts.forEach(function(part, i) {
      if (part) el.appendChild(document.createTextNode(part));
      if (i < parts.length - 1) {
        el.appendChild(document.createTextNode("/"));
        el.appendChild(document.createElement("wbr"));
      }
    });
  }

  // Same technique as setPath, but breaking at underscores so long key names
  // wrap at narrow widths without an innerHTML injection point.
  function setKeyName(el, value) {
    el.textContent = "";
    const parts = value.split("_");
    parts.forEach(function(part, i) {
      if (part) el.appendChild(document.createTextNode(part));
      if (i < parts.length - 1) {
        el.appendChild(document.createTextNode("_"));
        el.appendChild(document.createElement("wbr"));
      }
    });
  }

  setPath(document.getElementById("target-file"), file);
  setPath(document.getElementById("success-file"), file);

  const subEl = document.getElementById("prompt-sub");
  if (keys.length === 1) {
    subEl.appendChild(document.createTextNode("Enter value for "));
    const keyEl = document.createElement("span");
    keyEl.className = "hkey";
    keyEl.textContent = keys[0];
    subEl.appendChild(keyEl);
  } else {
    subEl.textContent = "Enter " + keys.length + " values";
  }

  const fileBarEl = document.getElementById("filebar");
  const fieldsEl = document.getElementById("fields");
  const formEl = document.getElementById("form");
  const errorEl = document.getElementById("error");
  const successEl = document.getElementById("success");
  const submitBtn = document.getElementById("submit-btn");

  keys.forEach(function(key, index) {
    const isExisting = existing.includes(key);
    const fieldId = "field-" + key.replace(/[^a-zA-Z0-9]/g, "-");

    const field = document.createElement("div");
    field.className = "field";

    const header = document.createElement("div");
    header.className = "field-header";

    const labelEl = document.createElement("label");
    labelEl.className = "key-label";
    labelEl.setAttribute("for", fieldId);

    if (keys.length > 1) {
      const tagEl = document.createElement("span");
      tagEl.className = "tag";
      tagEl.textContent = String(index + 1).padStart(2, "0");
      labelEl.appendChild(tagEl);
    }

    const nameEl = document.createElement("span");
    nameEl.className = "key-name";
    setKeyName(nameEl, key);
    labelEl.appendChild(nameEl);

    header.appendChild(labelEl);

    if (isExisting) {
      const badge = document.createElement("span");
      badge.className = "existing-badge";
      badge.textContent = "already set";
      labelEl.appendChild(badge);

      const toggle = document.createElement("label");
      toggle.className = "overwrite-toggle";
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.addEventListener("change", function() {
        input.disabled = !cb.checked;
        visBtn.disabled = !cb.checked;
        if (cb.checked) input.focus();
      });
      toggle.appendChild(cb);
      toggle.appendChild(document.createTextNode("overwrite"));
      header.appendChild(toggle);
    }

    field.appendChild(header);

    const wrap = document.createElement("div");
    wrap.className = "input-wrap";

    const input = document.createElement("input");
    input.type = "password";
    input.id = fieldId;
    input.name = key;
    input.autocomplete = "off";
    input.setAttribute("data-1p-ignore", "");
    input.setAttribute("data-lpignore", "true");
    input.setAttribute("data-bwignore", "");
    input.setAttribute("data-form-type", "other");
    input.disabled = isExisting;
    if (!isExisting) input.required = true;
    wrap.appendChild(input);

    const visBtn = document.createElement("button");
    visBtn.type = "button";
    visBtn.className = "toggle-vis";
    visBtn.disabled = isExisting;
    visBtn.textContent = "show";
    visBtn.title = "Toggle visibility";
    visBtn.addEventListener("click", function() {
      const isPassword = input.type === "password";
      input.type = isPassword ? "text" : "password";
      visBtn.textContent = isPassword ? "hide" : "show";
    });
    wrap.appendChild(visBtn);

    field.appendChild(wrap);
    fieldsEl.appendChild(field);
  });

  // Land with the caret in the first field the user can actually fill, so a
  // paste works immediately. Never steal focus from an already focused element.
  if (document.activeElement === null || document.activeElement === document.body) {
    const firstOpen = fieldsEl.querySelector(".input-wrap input:not([disabled])");
    if (firstOpen) firstOpen.focus();
  }

  formEl.addEventListener("submit", async function(e) {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = "Saving";
    errorEl.hidden = true;

    const fail = function(message) {
      errorEl.textContent = message;
      errorEl.hidden = false;
      submitBtn.disabled = false;
      submitBtn.textContent = "Save";
    };

    const values = {};
    for (const key of keys) {
      const fieldId = "field-" + key.replace(/[^a-zA-Z0-9]/g, "-");
      const input = document.getElementById(fieldId);
      if (!input.disabled && input.value) {
        values[key] = input.value;
      }
    }

    if (Object.keys(values).length === 0) {
      fail("No values to save. Enter at least one secret or enable overwrite.");
      return;
    }

    try {
      const resp = await fetch("/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, values }),
      });

      if (!resp.ok) {
        const data = await resp.json();
        throw new Error(data.error || "Failed to save");
      }

      formEl.hidden = true;
      fileBarEl.hidden = true;
      subEl.hidden = true;
      successEl.hidden = false;
    } catch (err) {
      fail(err.message);
    }
  });
})();
</script>

</body>
</html>
